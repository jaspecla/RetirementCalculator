name: PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - .github/workflows/pr-main.yml

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore RetirementCalculator.slnx

      - name: Build solution
        run: dotnet build RetirementCalculator.slnx --configuration Release --no-restore

      - name: Run test suite
        run: |
          mkdir -p TestResults
          dotnet test tests/RetirementCalculator.Domain.Tests/RetirementCalculator.Domain.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=domain-test-results.trx" --results-directory TestResults
          dotnet test tests/RetirementCalculator.Web.Tests/RetirementCalculator.Web.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=web-test-results.trx" --results-directory TestResults

      - name: Run Playwright tests
        run: |
          mkdir -p PlaywrightResults
          dotnet test tests/RetirementCalculator.Browser.Tests/RetirementCalculator.Browser.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=playwright-test-results.trx" --results-directory PlaywrightResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**
            **/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: PlaywrightResults/**
          if-no-files-found: warn
          retention-days: 7

  codeql:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build for analysis
        run: dotnet build RetirementCalculator.slnx --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
